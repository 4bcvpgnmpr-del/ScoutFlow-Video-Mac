name: Crear app de Mac
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            nombre: Mac-con-chip-Apple
          - os: macos-15-intel
            arch: x64
            nombre: Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bajar el editor publicado en la web
        run: |
          mkdir -p app
          curl -fsSL https://4bcvpgnmpr-del.github.io/Editor-de-video/index.html -o app/index.html
          ls -l app
      - name: Instalar
        run: npm install
      - name: Crear la app
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ScoutFlow-Video-${{ matrix.nombre }}
          path: dist/*.dmg
